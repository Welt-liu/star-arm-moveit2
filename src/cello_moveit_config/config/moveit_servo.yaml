###############################################
# Modify all parameters related to servoing here
###############################################

use_gazebo: false

## Properties of incoming commands
command_in_type: "unitless"
scale:
  # Max linear velocity. Unit is [m/s].
  linear: 1.50
  # Max angular velocity. Unit is [rad/s].
  rotational: 2.00
  # Max joint angular/linear velocity.
  joint: 2.00

## Properties of outgoing commands
publish_period: 0.015
low_latency_mode: true
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
is_primary_planning_scene_monitor: true

## MoveIt properties
move_group_name: arm
planning_frame: world

## Other frames
ee_frame_name: link6
robot_link_command_frame: link6

## Pose tracking control dimensions (used by xr_pose_tracking_node)
control_x_translation: true
control_y_translation: true
control_z_translation: true
control_x_rotation: true
control_y_rotation: true
control_z_rotation: true

## Stopping behaviour
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

## Configure handling of singularities and joint limits
lower_singularity_threshold: 170.0
hard_stop_singularity_threshold: 300.0
joint_limit_margin: 0.01
leaving_singularity_threshold_multiplier: 2.0

## Topic names
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
pose_command_in_topic: ~/pose_target
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /arm_controller/joint_trajectory

## Collision checking
check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
