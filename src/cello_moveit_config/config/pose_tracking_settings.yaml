#################################
# PID parameters for pose tracking
#################################

# Maximum value of error integral for all PID controllers
windup_limit: 0.20

# PID gains
x_proportional_gain: 20.0
y_proportional_gain: 20.0
z_proportional_gain: 20.0
x_integral_gain: 0.0
y_integral_gain: 0.0
z_integral_gain: 0.0
x_derivative_gain: 0.0
y_derivative_gain: 0.0
z_derivative_gain: 0.0

angular_proportional_gain: 6.0
angular_integral_gain: 0.0
angular_derivative_gain: 0.0
